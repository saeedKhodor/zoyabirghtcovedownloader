name: Build macOS Application

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build macOS App Bundle
        run: |
          pyinstaller --clean -y BrightcoveDownloader.spec

      - name: Package App Bundle into ZIP
        run: |
          cd dist
          zip -r -q "Brightcove-Video-Downloader-macOS.zip" "Brightcove Video Downloader.app"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brightcove-Video-Downloader-macOS
          path: dist/Brightcove-Video-Downloader-macOS.zip
